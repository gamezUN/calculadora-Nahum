<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f3f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #17233d;
    }

    .calculadora {
      width: 100%;
      max-width: 360px;
      padding: 25px;
      background: #ffffff;
      border: 1px solid #e5e9f0;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(25, 45, 80, 0.09);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 25px;
      text-align: center;
    }

    #pantalla {
      width: 100%;
      height: 68px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #e3e8f0;
      border-radius: 12px;
      background: #f8faff;
      color: #17233d;
      font-size: 28px;
      text-align: right;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-width: 0;
      min-height: 58px;
      border: 0;
      border-radius: 12px;
      background: #edf2fa;
      color: #243653;
      font-size: 19px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    button:hover {
      background: #dfe8f7;
    }

    button:active {
      transform: scale(0.96);
    }

    button.operador,
    button.igual {
      background: #4776d0;
      color: #ffffff;
    }

    button.operador:hover,
    button.igual:hover {
      background: #3564bd;
    }

    button.igual {
      background: #243653;
    }

    button.igual:hover {
      background: #17233d;
    }

    button.cero {
      grid-column: span 3;
    }

    @media (max-width: 380px) {
      .calculadora {
        padding: 18px;
      }

      button {
        min-height: 54px;
      }
    }
  </style>
</head>
<body>
  <main class="calculadora">
    <h1>Calculadora</h1>

    <input type="text" id="pantalla" value="0" readonly aria-label="Resultado">

    <section class="botones">
      <button type="button" onclick="limpiar()">AC</button>
      <button type="button" onclick="borrar()" aria-label="Borrar último dígito">⌫</button>
      <button type="button" class="operador" onclick="seleccionarOperacion('/')">÷</button>
      <button type="button" class="operador" onclick="seleccionarOperacion('*')">×</button>

      <button type="button" onclick="agregar('7')">7</button>
      <button type="button" onclick="agregar('8')">8</button>
      <button type="button" onclick="agregar('9')">9</button>
      <button type="button" class="operador" onclick="seleccionarOperacion('-')">−</button>

      <button type="button" onclick="agregar('4')">4</button>
      <button type="button" onclick="agregar('5')">5</button>
      <button type="button" onclick="agregar('6')">6</button>
      <button type="button" class="operador" onclick="seleccionarOperacion('+')">+</button>

      <button type="button" onclick="agregar('1')">1</button>
      <button type="button" onclick="agregar('2')">2</button>
      <button type="button" onclick="agregar('3')">3</button>
      <button type="button" onclick="agregar('.')">.</button>

      <button type="button" class="cero" onclick="agregar('0')">0</button>
      <button type="button" class="igual" onclick="calcular()">=</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
